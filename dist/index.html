<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#e8e1d2">
  <meta name="description" content="대한민국에서 철산과 가산 사이 안양천까지 이어지는 따뜻한 3D 지도.">
  <title>Sogeum · 철산과 안양천</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='20' fill='%232f5a51'/%3E%3Cpath d='M20 46c4-10 2-17 10-27 8 7 6 17 14 26-8-2-16 4-24 1Z' fill='%23c9d3a8'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/style.css">
  <script type="importmap">{"imports":{"three":"/vendor/three.module.js","three/addons/controls/OrbitControls.js":"/vendor/OrbitControls.js"}}</script>
</head>
<body>
  <div id="scene" aria-label="대한민국과 철산 안양천의 3D 지도. 드래그해서 둘러보고 스크롤해서 확대하세요."></div>
  <div class="grain"></div>
  <header>
    <a class="brand" href="/" aria-label="Sogeum 처음으로"><span class="brand-mark">◒</span><span>sogeum <small>소금</small></span></a>
    <div class="kst"><span id="period">깊은 밤</span><time id="clock">00:00</time><small>KST</small></div>
  </header>
  <main>
    <section class="intro" id="intro">
      <p class="eyebrow" id="eyebrow">A LITTLE MAP OF KOREA</p>
      <h1 id="title">대한민국,<br>조금 더 가까이.</h1>
      <p class="lede" id="lede">바다 위에 떠 있는 우리 동네.<br>철산에서 안양천까지 천천히 내려다보세요.</p>
      <button id="enter-place" class="place-card">
        <span class="place-icon">천</span>
        <span><strong>철산 · 안양천</strong><small>CHEOLSAN ↔ GASAN DIGITAL</small></span>
        <span class="arrow">↗</span>
      </button>
      <button id="back-korea" class="back" hidden>← 대한민국으로</button>
    </section>
    <div class="view-note" id="view-note"><span>DRAG TO ORBIT</span><i></i><span>SCROLL TO ZOOM</span></div>
    <div id="labels" aria-hidden="true"></div>
    <div class="map-key" id="map-key" hidden><span><i class="river"></i>안양천</span><span><i class="park"></i>도덕산</span><span><i class="road"></i>주요 도로</span></div>
    <button class="compass" id="reset" aria-label="시점 초기화">N<span>⌁</span></button>
  </main>
  <footer><span>Map data © OpenStreetMap contributors</span><span>Sunlight follows Korea Standard Time</span></footer>
  <div id="loading"><span>◒</span><p>지도를 펼치는 중…</p></div>
  <script type="module" src="/main.js?v=6"></script>
</body>
</html>
